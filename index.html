<style>
/* ---------- CONTACT ---------- */

.contact-page {
  min-height: 100vh;
  padding: 70px 6%;
  position: relative;
  overflow: hidden;
  color: #ffe8f7;
  font-family: "Kanit", sans-serif;
}

/* พื้นหลัง */
.contact-page::before {
  content: "";
  position: absolute;
  inset: 0;
  background:
    radial-gradient(circle at 15% 20%, rgba(255,180,230,.18), transparent 25%),
    radial-gradient(circle at 85% 25%, rgba(220,170,255,.16), transparent 28%),
    radial-gradient(circle at 50% 90%, rgba(255,150,220,.12), transparent 30%),
    linear-gradient(135deg, #171122, #26182f 50%, #130e1e);
  z-index: -3;
}

/* ดาว */
.contact-stars {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: -1;
}

.contact-stars span {
  position: absolute;
  color: #ffd9f3;
  text-shadow: 0 0 12px #ffbce7;
  animation: twinkle 3s ease-in-out infinite;
}

.contact-stars span:nth-child(1) {
  top: 12%;
  left: 8%;
  font-size: 28px;
}

.contact-stars span:nth-child(2) {
  top: 20%;
  right: 12%;
  font-size: 18px;
  animation-delay: .7s;
}

.contact-stars span:nth-child(3) {
  top: 55%;
  left: 5%;
  font-size: 20px;
  animation-delay: 1.2s;
}

.contact-stars span:nth-child(4) {
  bottom: 15%;
  right: 8%;
  font-size: 30px;
  animation-delay: 1.8s;
}

.contact-stars span:nth-child(5) {
  top: 42%;
  right: 30%;
  font-size: 14px;
  animation-delay: 2.2s;
}

@keyframes twinkle {
  0%, 100% {
    opacity: .35;
    transform: scale(.8);
  }
  50% {
    opacity: 1;
    transform: scale(1.2);
  }
}

/* กล่องหลัก */
.contact-box {
  max-width: 1100px;
  margin: auto;
  padding: 35px;
  border: 1px solid rgba(255,190,235,.35);
  border-radius: 28px;
  background: rgba(20,14,34,.72);
  box-shadow:
    0 0 40px rgba(255,150,220,.12),
    inset 0 0 30px rgba(255,255,255,.025);
  backdrop-filter: blur(15px);
}

/* หัวข้อ */
.contact-title {
  display: flex;
  align-items: center;
  gap: 16px;
  margin-bottom: 8px;
}

.contact-title .icon {
  width: 55px;
  height: 55px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 18px;
  background: rgba(255,170,225,.13);
  border: 1px solid rgba(255,190,235,.3);
  font-size: 30px;
  box-shadow: 0 0 20px rgba(255,150,220,.15);
}

.contact-title h1 {
  margin: 0;
  font-size: 32px;
  font-weight: 500;
  letter-spacing: 1px;
}

.contact-subtitle {
  margin: 0 0 30px 71px;
  color: #e9c9df;
  font-size: 15px;
}

/* การ์ด */
.contact-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
}

/* การ์ดแต่ละอัน */
.contact-card {
  position: relative;
  display: flex;
  align-items: center;
  gap: 17px;
  min-height: 125px;
  padding: 22px;
  border-radius: 20px;
  border: 1px solid rgba(255,190,235,.32);
  background:
    linear-gradient(
      145deg,
      rgba(255,180,225,.08),
      rgba(255,255,255,.025)
    );
  text-decoration: none;
  color: #ffe8f7;
  overflow: hidden;
  transition: .35s ease;
}

/* แสงด้านใน */
.contact-card::before {
  content: "";
  position: absolute;
  width: 130px;
  height: 130px;
  top: -70px;
  right: -50px;
  border-radius: 50%;
  background: rgba(255,180,225,.13);
  filter: blur(10px);
}

/* hover */
.contact-card:hover {
  transform: translateY(-7px);
  border-color: rgba(255,205,240,.7);
  box-shadow:
    0 12px 35px rgba(255,140,215,.15),
    0 0 20px rgba(255,180,230,.1);
}

/* ไอคอน */
.contact-icon {
  width: 58px;
  height: 58px;
  flex-shrink: 0;
  border-radius: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 29px;
  background: rgba(255,170,225,.12);
  border: 1px solid rgba(255,200,235,.28);
  box-shadow: inset 0 0 18px rgba(255,180,225,.08);
}

/* ข้อความ */
.contact-info {
  position: relative;
  z-index: 2;
}

.contact-name {
  font-size: 18px;
  margin-bottom: 5px;
}

.contact-id {
  color: #dcbdd4;
  font-size: 14px;
  word-break: break-word;
}

/* ลูกศร */
.contact-arrow {
  margin-left: auto;
  font-size: 24px;
  color: #ffc7e9;
  transition: .3s ease;
}

.contact-card:hover .contact-arrow {
  transform: translateX(6px);
}

/* ข้อความด้านล่าง */
.contact-footer {
  text-align: center;
  margin-top: 35px;
  color: #dcbdd4;
  font-size: 14px;
}

.contact-footer span {
  color: #ffbde5;
}

/* มือถือ / iPad */
@media (max-width: 800px) {
  .contact-grid {
    grid-template-columns: 1fr;
  }

  .contact-box {
    padding: 25px 18px;
  }

  .contact-subtitle {
    margin-left: 0;
  }

  .contact-title h1 {
    font-size: 27px;
  }
}
</style>
