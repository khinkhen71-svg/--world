.music{position:fixed;right:16px;top:16px;z-index:20}

#characterPopup{position:fixed;right:18px;bottom:18px;z-index:19;width:min(260px,72vw);padding:10px;display:none;animation:popupIn .45s ease}

.character-card img{display:block;width:100%;border-radius:18px}

.close-char{position:absolute;right:18px;top:112px;border:0;background:rgba(9,7,11,.72);color:#fff;border-radius:50%;width:28px;height:28px;cursor:pointer}

.reopen-char.show{display:block}
@keyframes popupIn{from{opacity:0;transform:translateX(30px) translateY(12px)}to{opacity:1;transform:none}}

body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(circle at 12% 35%,rgba(255,180,220,.16),transparent 22%),radial-gradient(circle at 88% 30%,rgba(180,150,255,.13),transparent 25%),radial-gradient(circle at 50% 100%,rgba(255,190,225,.10),transparent 30%);}

splay:flex;gap:12px;flex-wrap:wrap}.home-likes .item{flex:1 1 150px}.doll-note{color:var(--muted);font-size:13px;margin-top:8px}@media(max-width:760px){.home-hero{grid-template-columns:1fr}.home-hero .welcome-art{min-height:150px}.home-games{grid-template-columns:repeat(2,1fr)}.home-contacts{grid-template-columns:1fr}.home-spec{grid-template-columns:1fr 1fr}.home-spec .intro{grid-column:1/-1}.site-shell{padding:0 10px 30px}}

<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Khen's World ♡</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500&family=Playfair+Display:wght@500;600&display=swap');

:root{
  --bg:#09070b;
  --card:#151018;
  --pink:#f4b8d5;
  --pink2:#ffd8e9;
  --pearl:#fff8fc;
  --muted:#bbaab5;
  --line:rgba(255,210,232,.18);
}

*{box-sizing:border-box}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  background:
    radial-gradient(circle at 20% 10%,rgba(244,184,213,.1),transparent 28%),
    radial-gradient(circle at 85% 80%,rgba(255,248,252,.07),transparent 25%),
    var(--bg);
  color:var(--pearl);
  font-family:Kanit,sans-serif;
  min-height:100vh;
  overflow-x:hidden;
}

a{
  color:inherit;
  text-decoration:none;
}

#particles{
  position:fixed;
  inset:0;
  pointer-events:none;
  overflow:hidden;
  z-index:0;
}

.particle{
  position:absolute;
  opacity:.7;
  animation:float 7s linear infinite;
  color:var(--pink2);
}

@keyframes float{
  0%{
    transform:translateY(110vh) rotate(0);
    opacity:0;
  }
  15%{
    opacity:.7;
  }
  85%{
    opacity:.7;
  }
  100%{
    transform:translateY(-15vh) rotate(180deg);
    opacity:0;
  }
}

.cover{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:30px;
  position:relative;
  z-index:2;
}

.cover-box{
  max-width:700px;
  padding:45px 25px;
  border:1px solid var(--line);
  border-radius:28px;
  background:rgba(21,16,24,.78);
  backdrop-filter:blur(12px);
  box-shadow:0 20px 80px rgba(0,0,0,.4);
}

.small{
  letter-spacing:5px;
  color:var(--pink);
  font-size:12px;
}

h1{
  font-family:"Playfair Display",serif;
  font-size:clamp(42px,10vw,82px);
  margin:14px 0 4px;
}

.subtitle{
  color:var(--muted);
  margin-bottom:28px;
}

.enter{
  border:1px solid var(--pink);
  color:var(--pink2);
  background:transparent;
  padding:13px 25px;
  border-radius:999px;
  cursor:pointer;
  transition:.25s;
}

.enter:hover{
  background:rgba(244,184,213,.12);
  transform:translateY(-2px);
}

#site{
  display:none;
  position:relative;
  z-index:1;
}

nav{
  position:sticky;
  top:0;
  z-index:10;
  display:flex;
  gap:8px;
  justify-content:center;
  flex-wrap:wrap;
  padding:13px 10px;
  background:rgba(9,7,11,.84);
  backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
}

.nav-btn{
  border:1px solid transparent;
  background:transparent;
  color:var(--muted);
  padding:8px 12px;
  border-radius:999px;
  cursor:pointer;
}

.nav-btn:hover,
.nav-btn.active{
  color:var(--pink2);
  border-color:var(--line);
  background:rgba(244,184,213,.07);
}

.page{
  display:none;
  max-width:900px;
  margin:auto;
  min-height:calc(100vh - 70px);
  padding:70px 20px 90px;
  animation:pageIn .45s ease;
}

.page.active{
  display:block;
}

@keyframes pageIn{
  from{
    opacity:0;
    transform:translateY(12px);
  }
  to{
    opacity:1;
    transform:none;
  }
}

.page-title{
  font-family:"Playfair Display",serif;
  font-size:clamp(34px,8vw,58px);
  margin:0 0 8px;
}

.page-sub{
  color:var(--muted);
  margin:0 0 30px;
}

.card{
  background:rgba(21,16,24,.78);
  border:1px solid var(--line);
  border-radius:24px;
  padding:24px;
  margin:15px 0;
  box-shadow:0 15px 50px rgba(0,0,0,.18);
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(190px,1fr));
  gap:15px;
}

.item{
  border:1px solid var(--line);
  border-radius:20px;
  padding:20px;
  background:rgba(255,255,255,.025);
  transition:.25s;
}

.item:hover{
  transform:translateY(-4px);
  border-color:rgba(244,184,213,.45);
}

.icon{
  font-size:27px;
}

.label{
  color:var(--pink);
  font-size:13px;
  margin-top:7px;
}

.value{
  font-size:17px;
  margin-top:3px;
}

.contact-btn{
  display:block;
  border:1px solid var(--line);
  border-radius:18px;
  padding:15px 17px;
  margin:10px 0;
  background:rgba(255,255,255,.025);
  transition:.2s;
}

.contact-btn:hover{
  background:rgba(244,184,213,.1);
  transform:translateX(4px);
}

.palette{
  display:flex;
  gap:14px;
  flex-wrap:wrap;
}

.swatch{
  min-width:130px;
  height:100px;
  border-radius:22px;
  display:flex;
  align-items:end;
  padding:12px;
  border:1px solid var(--line);
  color:#33252e;
}

.pink{
  background:#f4b8d5;
}

.pearlpink{
  background:#ffd8e9;
}

.whitepearl{
  background:#fff8fc;
}

.game-code{
  font-family:monospace;
  color:var(--pink2);
  background:rgba(0,0,0,.3);
  padding:3px 7px;
  border-radius:7px;

footer{

<script>
const music=document.getElementById("bgMusic");
const musicBtn=document.getElementById("musicBtn");

function enterSite(){
  document.getElementById("cover").style.display="none";
  document.getElementById("site").style.display="block";
  showPage("home",false);

  try{
    music.play().catch(()=>{});
  }catch(e){}
}

function showPage(id,sound=true){
  document.querySelectorAll(".page").forEach(p=>{
    p.classList.remove("active");
  });

  document.querySelectorAll(".nav-btn").forEach(b=>{
    b.classList.remove("active");
  });

  const page=document.getElementById(id);
  if(page) page.classList.add("active");

  const button=[...document.querySelectorAll(".nav-btn")]
    .find(b=>b.getAttribute("onclick")?.includes("'"+id+"'"));

  if(button) button.classList.add("active");

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

  if(sound) playClick();
}

function toggleMusic(){
  if(music.paused){
    music.play().then(()=>{
      musicBtn.textContent="♫ Music ON";
    }).catch(()=>{
      musicBtn.textContent="♫ Tap again";
    });
  }else{
    music.pause();
    musicBtn.textContent="♫ Music OFF";
  }
}

function playClick(){
  try{
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    const osc=ctx.createOscillator();
    const gain=ctx.createGain();

    osc.type="sine";
    osc.frequency.value=880;
    gain.gain.setValueAtTime(.0001,ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(.04,ctx.currentTime+.01);
    gain.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+.09);

    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime+.1);
  }catch(e){}
}

function closeCharacter(){
  document.getElementById("characterPopup").classList.remove("show");
  document.getElementById("reopenChar").classList.add("show");
}

function openCharacter(){
  document.getElementById("characterPopup").classList.add("show");
  document.getElementById("reopenChar").classList.remove("show");
}

const symbols=["✦","✧","♡","⋆","·"];

for(let i=0;i<28;i++){
  const p=document.createElement("span");
  p.className="particle";
  p.textContent=symbols[Math.floor(Math.random()*symbols.length)];
  p.style.left=Math.random()*100+"%";
  p.style.animationDelay=(Math.random()*7)+"s";
  p.style.animationDuration=(5+Math.random()*7)+"s";
  p.style.fontSize=(8+Math.random()*12)+"px";
  document.getElementById("particles").appendChild(p);
}

window.addEventListener("load",()=>{
  setTimeout(()=>{
    document.getElementById("characterPopup").classList.add("show");
  },1200);
});
</script>
